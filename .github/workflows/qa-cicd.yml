name: Enterprise DevSecOps CICD Pipeline
on: 
  push:
    branches:
      - QA
    paths:
      - client/**
      - server/**
      - .github/workflows/qa-cicd.yml

jobs:
  gitleaks-scan: #job id / kind of discription / this can be used /called in other piece of pipeline code
    name: Gitleaks Scan # just label name for our jib
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: Run Gitleaks Scan
        run:  |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  checkov-terraform:
   name: Checkov Terraform Scan
   runs-on: ubuntu-latest
   needs: gitleaks-scan
   steps:
     - name: Checkout source code
       uses: actions/checkout@v4
     - name: Seutp Python
       uses: actions/setup-python@v5
       with:
         python-version: "3.11"
     - name: Install checkov
       run: pip install checkov
     - name: Run Checkov Terraform Scan
       run:  |
         checkov -d . \
           --framework terraform \
           --output json > checkov-terraform.json || true
     - name: Upload checkov Terraform Report
       uses: actions/upload-artifact@v4
       with:
         name: checkov-terrform-report
         path: checkov-terraform-report.json
         if-no-files-found: warn



  checkov-k8s:
   name: Checkov Kubernetes Scan
   runs-on: ubuntu-latest
   needs: gitleaks-scan
   steps:
     - name: Checkout source code
       uses: actions/checkout@v4
     - name: Seutp Python
       uses: actions/setup-python@v5
       with:
         python-version: "3.11"
     - name: Install checkov
       run: pip install checkov
     - name: Run Checkov Terraform Scan
       run:  |
         checkov -d . \
           --framework kubernetes \
           --output json > checkov-k8s.json || true
     - name: Upload checkov Kubernetes Report
       uses: actions/upload-artifact@v4
       with:
         name: checkov-k8s-report
         path: checkov-k8s-report.json
         if-no-files-found: warn


  checkov-dockerfile:
   name: Checkov Dockerfile Scan
   runs-on: ubuntu-latest
   needs: gitleaks-scan
   steps:
     - name: Checkout source code
       uses: actions/checkout@v4
     - name: Seutp Python
       uses: actions/setup-python@v5
       with:
         python-version: "3.11"
     - name: Install checkov
       run: pip install checkov
     - name: Run Checkov Dockerfile Scan
       run:  |
         checkov -d . \
           --framework dockerfile \
           --output json > checkov-dockerfile.json || true
     - name: Upload checkov dockerfile Report
       uses: actions/upload-artifact@v4
       with:
         name: checkov-dockerfile-report
         path: checkov-dockerfile-report.json
         if-no-files-found: warn
